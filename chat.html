<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Luna - Secure Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --bg:#0b0b10; --panel:#14141b; --accent:#6a11cb; --text:#ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .user { align-self: flex-end; background: var(--accent); }
        .ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); }
        .input-area { padding: 20px; background: var(--panel); display: flex; gap: 10px; }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="chat-window">
        </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Luna anything..." />
        <button id="send-btn">Send</button>
    </div>

    <script type="module">
        // 1. YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBw2zk_4_qNqMCy8FrEALX_MZ5qOCu0vSE",
            authDomain: "luna-588ba.firebaseapp.com",
            projectId: "luna-588ba",
            storageBucket: "luna-588ba.firebasestorage.app",
            messagingSenderId: "694784257459",
            appId: "1:694784257459:web:eaab24336174766c7cafc6",
            measurementId: "G-QC1M835FZ9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 2. YOUR RENDER BACKEND URL (Change this after deploying to Render)
        const RENDER_BACKEND_URL = "https://luna-backend.onrender.com/chat";

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let currentUser = null;

        // Check Auth State
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                addMessage("Luna is ready. How can I help?", 'ai');
            } else {
                window.location.href = "index.html"; // Redirect to login if not authenticated
            }
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || !currentUser) return;

            userInput.value = '';
            sendBtn.disabled = true;

            // Add user message to UI and Firebase
            addMessage(text, 'user');
            const convoRef = db.collection('users').doc(currentUser.uid).collection('convos').doc('active_chat');
            await convoRef.collection('messages').add({
                sender: 'user',
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            // Add AI placeholder
            const aiMsgDiv = addMessage("Luna is thinking...", 'ai');

            try {
                // TALK TO RENDER BACKEND (The Secure Way)
                const response = await fetch(RENDER_BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.error) throw new Error(data.error);

                // Update UI with real response
                aiMsgDiv.textContent = data.response;

                // Save AI response to Firebase
                await convoRef.collection('messages').add({
                    sender: 'ai',
                    text: data.response,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

            } catch (err) {
                aiMsgDiv.textContent = "❌ Error: " + err.message;
                console.error("Backend Error:", err);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    </script>
</body>
</html>
