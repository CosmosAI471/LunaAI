<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="/Fevicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/Fevicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/Fevicon/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Luna - Secure AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <style>
        :root { --bg:#0b0b10; --panel:#14141b; --accent:#6a11cb; --text:#ffffff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; background: var(--panel); display: flex; gap: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 8px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        button:disabled { opacity: 0.5; filter: grayscale(1); }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="msg ai">Hello! I am Luna. How can I assist you today?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Luna anything..." autocomplete="off" />
        <button id="send-btn">Send</button>
    </div>

    <script>
        // 1. PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBw2zk_4_qNqMCy8FrEALX_MZ5qOCu0vSE",
            authDomain: "luna-588ba.firebaseapp.com",
            projectId: "luna-588ba",
            storageBucket: "luna-588ba.firebasestorage.app",
            messagingSenderId: "694784257459",
            appId: "1:694784257459:web:eaab24336174766c7cafc6",
            measurementId: "G-QC1M835FZ9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 2. YOUR RENDER URL
        // Copy this from the top of your Render Dashboard (e.g., https://luna-backend.onrender.com)
        const BACKEND_URL = "https://lunabackend-oh3l.onrender.com/chat";

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let currentUser = null;

        auth.onAuthStateChanged(user => {
            if (user) { currentUser = user; } 
            else { window.location.href = "index.html"; }
        });

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return div;
        }

        async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || !currentUser || sendBtn.disabled) return;

    userInput.value = '';
    sendBtn.disabled = true;

    addMessage(text, 'user');
    const aiMsgDiv = addMessage("Luna is thinking...", 'ai');

    try {
        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

        const data = await response.json();

        if (data.error) {
            // SHOW THE REAL ERROR ON SCREEN FOR MOBILE DEBUGGING
            aiMsgDiv.style.color = "#ff4d4d";
            aiMsgDiv.textContent = "Backend Error: " + data.error;
        } else {
            aiMsgDiv.textContent = data.response;
            
            // Save to Firebase
            db.collection('users').doc(currentUser.uid).collection('chats').add({
                user: text,
                ai: data.response,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    } catch (err) {
        aiMsgDiv.style.color = "#ff4d4d";
        aiMsgDiv.textContent = "Network Error: Could not reach Render server. Check your BACKEND_URL.";
        console.error(err);
    } finally {
        sendBtn.disabled = false;
    }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
